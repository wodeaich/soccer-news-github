<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#aa0000;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#cc0000;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a1a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="pitch" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2d7a2d;stop-opacity:0.5" />
      <stop offset="100%" style="stop-color:#1a5c1a;stop-opacity:0.5" />
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <rect width="1280" height="720" fill="url(#pitch)"/>
  <!-- Pitch lines -->
  <rect x="120" y="80" width="1040" height="560" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="3"/>
  <line x1="640" y1="80" x2="640" y2="640" stroke="rgba(255,255,255,0.15)" stroke-width="3"/>
  <circle cx="640" cy="360" r="100" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="3"/>
  <circle cx="640" cy="360" r="8" fill="rgba(255,255,255,0.25)"/>
  <rect x="120" y="220" width="180" height="240" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="3"/>
  <rect x="980" y="220" width="180" height="240" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="3"/>
  <!-- Spain flag strip -->
  <rect x="0" y="0" width="24" height="720" fill="#c60b1e"/>
  <rect x="0" y="180" width="24" height="360" fill="#ffc400"/>
  <!-- Germany flag strip -->
  <rect x="1256" y="0" width="24" height="240" fill="#000"/>
  <rect x="1256" y="240" width="24" height="240" fill="#dd0000"/>
  <rect x="1256" y="480" width="24" height="240" fill="#ffce00"/>
  <!-- Score area -->
  <rect x="480" y="280" width="320" height="160" rx="16" fill="rgba(0,0,0,0.55)"/>
  <text x="490" y="355" font-family="Arial Black,Arial" font-weight="900" font-size="22" fill="rgba(255,255,255,0.85)" text-anchor="start">ESP</text>
  <text x="640" y="375" font-family="Arial Black,Arial" font-weight="900" font-size="56" fill="#ffffff" text-anchor="middle">2 – 0</text>
  <text x="790" y="355" font-family="Arial Black,Arial" font-weight="900" font-size="22" fill="rgba(255,255,255,0.85)" text-anchor="end">GER</text>
  <text x="640" y="415" font-family="Arial,sans-serif" font-size="15" fill="rgba(255,255,255,0.6)" text-anchor="middle">GROUP STAGE · FIFA WORLD CUP 2026</text>
  <!-- Bottom gradient -->
  <defs>
    <linearGradient id="btm" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#000;stop-opacity:0" />
      <stop offset="100%" style="stop-color:#000;stop-opacity:0.72" />
    </linearGradient>
  </defs>
  <rect x="0" y="480" width="1280" height="240" fill="url(#btm)"/>
  <text x="64" y="618" font-family="Arial Black,Arial" font-weight="900" font-size="40" fill="#ffffff">Spain's midfield masterclass sinks Germany</text>
  <text x="64" y="658" font-family="Arial,sans-serif" font-size="22" fill="rgba(255,255,255,0.65)">Jun 12, 2026 · CompSoccer</text>
</svg>
