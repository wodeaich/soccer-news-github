<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a3d62;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1e5799;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#003d1a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="pitch" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2d7a2d;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#1a5c1a;stop-opacity:0.6" />
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="2"/></filter>
  </defs>
  <!-- Background -->
  <rect width="1280" height="720" fill="url(#bg)"/>
  <!-- Pitch pattern -->
  <rect width="1280" height="720" fill="url(#pitch)"/>
  <!-- Pitch lines -->
  <rect x="120" y="80" width="1040" height="560" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="3"/>
  <line x1="640" y1="80" x2="640" y2="640" stroke="rgba(255,255,255,0.15)" stroke-width="3"/>
  <circle cx="640" cy="360" r="100" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="3"/>
  <circle cx="640" cy="360" r="8" fill="rgba(255,255,255,0.25)"/>
  <!-- Left penalty box -->
  <rect x="120" y="220" width="180" height="240" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="3"/>
  <!-- Right penalty box -->
  <rect x="980" y="220" width="180" height="240" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="3"/>
  <!-- Argentina flag strip (left) -->
  <rect x="0" y="0" width="12" height="720" fill="#74ACDF"/>
  <rect x="12" y="0" width="12" height="720" fill="#74ACDF"/>
  <rect x="0" y="240" width="24" height="240" fill="#fff"/>
  <!-- Brazil flag strip (right) -->
  <rect x="1256" y="0" width="12" height="720" fill="#009c3b"/>
  <rect x="1268" y="0" width="12" height="720" fill="#ffdf00"/>
  <!-- Score area -->
  <rect x="480" y="280" width="320" height="160" rx="16" fill="rgba(0,0,0,0.55)"/>
  <!-- Argentina side -->
  <text x="490" y="355" font-family="Arial Black,Arial" font-weight="900" font-size="22" fill="rgba(255,255,255,0.85)" text-anchor="start">ARG</text>
  <!-- Score -->
  <text x="640" y="375" font-family="Arial Black,Arial" font-weight="900" font-size="56" fill="#ffffff" text-anchor="middle">2 – 1</text>
  <!-- Brazil side -->
  <text x="790" y="355" font-family="Arial Black,Arial" font-weight="900" font-size="22" fill="rgba(255,255,255,0.85)" text-anchor="end">BRA</text>
  <!-- Match label -->
  <text x="640" y="415" font-family="Arial,sans-serif" font-size="15" fill="rgba(255,255,255,0.6)" text-anchor="middle">GROUP STAGE · FIFA WORLD CUP 2026</text>
  <!-- Bottom overlay gradient -->
  <defs>
    <linearGradient id="btm" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#000;stop-opacity:0" />
      <stop offset="100%" style="stop-color:#000;stop-opacity:0.72" />
    </linearGradient>
  </defs>
  <rect x="0" y="480" width="1280" height="240" fill="url(#btm)"/>
  <!-- Title -->
  <text x="64" y="618" font-family="Arial Black,Arial" font-weight="900" font-size="40" fill="#ffffff">Argentina edge Brazil in a World Cup 2026 classic</text>
  <text x="64" y="658" font-family="Arial,sans-serif" font-size="22" fill="rgba(255,255,255,0.65)">Jun 12, 2026 · CompSoccer</text>
</svg>
