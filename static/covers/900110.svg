<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a3d62;stop-opacity:1" />
      <stop offset="55%" style="stop-color:#1e5799;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06301a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="pitch" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2d7a2d;stop-opacity:0.45" />
      <stop offset="100%" style="stop-color:#1a5c1a;stop-opacity:0.45" />
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <rect width="1280" height="720" fill="url(#pitch)"/>
  <!-- Pitch lines -->
  <rect x="120" y="80" width="1040" height="560" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="3"/>
  <line x1="640" y1="80" x2="640" y2="640" stroke="rgba(255,255,255,0.12)" stroke-width="3"/>
  <circle cx="640" cy="360" r="120" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="3"/>
  <!-- Flag strips -->
  <rect x="0" y="0" width="22" height="720" fill="#74ACDF"/>
  <rect x="0" y="240" width="22" height="240" fill="#fff"/>
  <rect x="1258" y="0" width="11" height="720" fill="#009c3b"/>
  <rect x="1269" y="0" width="11" height="720" fill="#ffdf00"/>
  <!-- Player figure (celebration) -->
  <g transform="translate(760,140)" fill="#ffffff" fill-opacity="0.92">
    <circle cx="60" cy="52" r="42"/>
    <path d="M26 100 Q60 84 94 100 L108 262 Q60 278 14 262 Z"/>
    <rect x="-12" y="100" width="32" height="128" rx="16" transform="rotate(38 4 164)"/>
    <rect x="100" y="100" width="32" height="128" rx="16" transform="rotate(-38 116 164)"/>
    <rect x="24" y="258" width="36" height="168" rx="18" transform="rotate(13 42 342)"/>
    <rect x="60" y="258" width="36" height="168" rx="18" transform="rotate(-17 78 342)"/>
  </g>
  <!-- Ball -->
  <circle cx="742" cy="582" r="34" fill="#ffffff"/>
  <path d="M742 556 l22 16 -8 26 -28 0 -8 -26 z" fill="#111"/>
  <!-- Scoreboard (left) -->
  <rect x="96" y="288" width="330" height="172" rx="18" fill="rgba(0,0,0,0.58)"/>
  <text x="130" y="372" font-family="Arial Black,Arial" font-weight="900" font-size="30" fill="rgba(255,255,255,0.9)" text-anchor="start">ARG</text>
  <text x="261" y="392" font-family="Arial Black,Arial" font-weight="900" font-size="70" fill="#ffffff" text-anchor="middle">2–1</text>
  <text x="392" y="372" font-family="Arial Black,Arial" font-weight="900" font-size="30" fill="rgba(255,255,255,0.9)" text-anchor="end">BRA</text>
  <text x="261" y="436" font-family="Arial,sans-serif" font-size="15" fill="rgba(255,255,255,0.6)" text-anchor="middle">GROUP STAGE · WORLD CUP 2026</text>
</svg>
