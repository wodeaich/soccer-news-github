    <script>
      let hasObserver = 0;
      (function () {
        const mutationObserver = new MutationObserver((mutations) => {
          mutations.forEach((mutation) => {
            if (mutation.type === "attributes") {
              if (
                mutation.attributeName === "data-anchor-status" &&
                mutation.target.id.includes("_anchor_0")
              ) {
                hasObserver += 1;

                let targetElements = document.querySelectorAll(
                  '[data-anchor-status="displayed"], [data-anchor-shown="true"]'
                );

                // 创建一个 IntersectionObserver 实例
                let observer = new IntersectionObserver(
                  (entries, observer) => {
                    entries.forEach((entry) => {
                      if (entry.isIntersecting) {
                        if (
                          entry.boundingClientRect.top == 0 &&
                          entry.boundingClientRect.bottom > 0
                        ) {
                          /* 获取body的padding高度 */
                          const body = document.body;
                          if (body) {
                            const bodyPaddingTop = parseInt(
                              window.getComputedStyle(body).paddingTop
                            );
                            if (bodyPaddingTop) {
                              window.scrollBy(0, -bodyPaddingTop);
                            }
                          }
                        }
                        observer.disconnect();
                      }
                    });
                  },
                  {
                    root: null, // 使用默认的视口（即浏览器窗口）
                    rootMargin: "0px", // 可选的视口边距
                    threshold: 0.1 // 触发回调的阈值，表示元素与视口交集的比例
                  }
                );

                // 启动观察
                targetElements?.forEach((element) => {
                  observer.observe(element); // 观察每个符合条件的元素
                });

                if (hasObserver === 2) {
                  mutationObserver.disconnect();
                }
              }
            }
          });
        });

        mutationObserver.observe(document.documentElement, {
          childList: true,
          subtree: true,
          attributes: true,
          attributeFilter: ["data-anchor-status"]
        });
      })();
    </script>

    <script>
      googletag.cmd.push(() => {
        googletag.display(interstitialSlot);
        googletag.display(anchorSlot);
      });

      // 初始化标志变量
      window.isUnloaded = false;
      // 监听页面即将卸载事件
      window.addEventListener("beforeunload", () => {
        var elementUrlIndex = window.dataLayer.findIndex(
          ({ event: eventType }) => "gtm.linkClick" === eventType
        );
        // 如果找到了对应事件，且标志变量为 false，则执行逻辑
        if (-1 === elementUrlIndex || window.isUnloaded) {
          return;
        }
        // 根据条件执行不同逻辑
        if (1 === window.clickOpen) {
          // 点击穿插广告
          dataLayer.push({ event: "D_AL" });
        } else {
          // 用户点击跳转
          dataLayer.push({ event: "D_RE" });
        }
        window.isUnloaded = true;
      });
      // 监听 hash 变化事件 --- 判断穿插全屏广告出现
      window.addEventListener("hashchange", () => {
        if ("#google_vignette" == window.location.hash) {
          window.clickOpen = 1;
          // 触发穿插
          dataLayer.push({ event: "C_AL" });
          if (
            window.location.hostname !== "www.compsoccer.com" &&
            window.location.hostname !== "compsoccer.com"
          ) {
            // 清除穿插缓存
            localStorage.removeItem("__lsv__");
          }
        }
      });
      // 监听消息事件
      window.addEventListener("message", (event) => {
        if (
          '{"eventType":"adClosed","result":{"status":1},"googMsgType":"fullscreen"}' === event.data
        ) {
          window.clickOpen = 0;
          // 关闭穿插广告
          dataLayer.push({ event: "G_AL" });
        }
      });
      // 监听失去焦点事件
      window.addEventListener("blur", () => {
        const activeElement = document.activeElement,
          sourceAttribute = activeElement.getAttribute("name");
        if (
          sourceAttribute &&
          -1 !== sourceAttribute.indexOf("google_ads_iframe_/23197833490") &&
          -1 === sourceAttribute.indexOf("anchor_0")
        ) {
          let adStatus = "false";
          if (activeElement) {
            adStatus = closestIns.getAttribute("data-load-complete") || adStatus;
          }
          if ("true" == adStatus) {
            // 点击页内广告
            dataLayer.push({ event: "D_IP" });
          }
        } else if (sourceAttribute && -1 !== sourceAttribute.indexOf("anchor_0")) {
          // 点击锚定广告
          dataLayer.push({ event: "D_FI" });
        }
      });
    </script>
