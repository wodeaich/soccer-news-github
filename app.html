<!DOCTYPE html>
<html lang="en">
  <head {{ HEAD_ATTRS }}>
    {{ HEAD }}
    <meta charset="UTF-8" />

    <link rel="preload" href="https://securepubads.g.doubleclick.net/tag/js/gpt.js" as="script" />
    <script async src="https://securepubads.g.doubleclick.net/tag/js/gpt.js"></script>

    <script>
      window.googletag = window.googletag || { cmd: [] };
      let interstitialSlot, anchorSlot;

      googletag.cmd.push(function () {
        interstitialSlot = googletag.defineOutOfPageSlot(
          "/23197833490/soccerins/soccerins_interstitial",
          googletag.enums.OutOfPageFormat.INTERSTITIAL
        );

        if (interstitialSlot) {
          interstitialSlot.addService(googletag.pubads()).setConfig({
            interstitial: {
              triggers: {
                navBar: true,
                unhideWindow: true
              }
            }
          });
          googletag.pubads().addEventListener("slotOnload", (event) => {
            if (interstitialSlot === event.slot) {
              console.log("Interstitial is loaded.");
            }
          });
        }
        anchorSlot = googletag.defineOutOfPageSlot(
          "/23197833490/soccerins/soccerins_anchor",
          googletag.enums.OutOfPageFormat.BOTTOM_ANCHOR
        );

        if (anchorSlot) {
          anchorSlot.addService(googletag.pubads());
        }
        googletag.enableServices();
      });
    </script>

      async
      src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1853000876464912"

    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());

      gtag("config", "G-4ZQQBJW72Y");
    </script>
    <!-- Google Tag Manager -->
    <script>
      (function (w, d, s, l, i) {
        w[l] = w[l] || [];
        w[l].push({ "gtm.start": new Date().getTime(), event: "gtm.js" });
        var f = d.getElementsByTagName(s)[0],
          j = d.createElement(s),
          dl = l != "dataLayer" ? "&l=" + l : "";
        j.async = true;
        j.src = "https://www.googletagmanager.com/gtm.js?id=" + i + dl;
        f.parentNode.insertBefore(j, f);
      })(window, document, "script", "dataLayer", "GTM-MVL6T7G3");
    </script>
    <!-- End Google Tag Manager -->

    <script
      async
      src="https://fundingchoicesmessages.google.com/i/pub-1853000876464912?ers=1"
    ></script>
    <script>
      (function () {
        function signalGooglefcPresent() {
          if (!window.frames["googlefcPresent"]) {
            if (document.body) {
              const iframe = document.createElement("iframe");
              iframe.style =
                "width: 0; height: 0; border: none; z-index: -1000; left: -1000px; top: -1000px;";
              iframe.style.display = "none";
              iframe.name = "googlefcPresent";
              document.body.appendChild(iframe);
            } else {
              setTimeout(signalGooglefcPresent, 0);
            }
          }
        }
        signalGooglefcPresent();
      })();
    </script>

    <script>
      window.addEventListener("load", function () {
        if ("serviceWorker" in window.navigator) {
          window.navigator.serviceWorker
            .register("/sw.js")
            .then(() => {})
            .catch(() => {});
        }
        window.addEventListener("beforeinstallprompt", (e) => {
          e.preventDefault();
          window.deferredPrompt = e;
        });
      });
    </script>
  </head>
  <body {{ BODY_ATTRS }}>
    <!-- Google Tag Manager (noscript) -->
    <noscript
      ><iframe
        src="https://www.googletagmanager.com/ns.html?id=GTM-MVL6T7G3"
        height="0"
        width="0"
        style="display: none; visibility: hidden"
      ></iframe
    ></noscript>
    <!-- End Google Tag Manager (noscript) -->
    {{ APP }}
    <script>
      googletag.cmd.push(() => {
        googletag.display(interstitialSlot);
        googletag.display(anchorSlot);
      });

      // 初始化标志变量
      window.isUnloaded = false;
      // 监听页面即将卸载事件
      window.addEventListener("beforeunload", () => {
        var elementUrlIndex = window.dataLayer.findIndex(
          ({ event: eventType }) => "gtm.linkClick" === eventType
        );
        // 如果找到了对应事件，且标志变量为 false，则执行逻辑
        if (-1 === elementUrlIndex || window.isUnloaded) {
          return;
        }
        // 根据条件执行不同逻辑
        if (1 === window.clickOpen) {
          // 点击穿插广告
          dataLayer.push({ event: "D_AL" });
        } else {
          // 用户点击跳转
          dataLayer.push({ event: "D_RE" });
        }
        window.isUnloaded = true;
      });
      // 监听 hash 变化事件 --- 判断穿插全屏广告出现
      window.addEventListener("hashchange", () => {
        if ("#google_vignette" == window.location.hash) {
          window.clickOpen = 1;
          // 触发穿插
          dataLayer.push({ event: "C_AL" });
        }
      });
      // 监听消息事件
      window.addEventListener("message", (event) => {
        if (
          '{"eventType":"adClosed","result":{"status":1},"googMsgType":"fullscreen"}' ===
            event.data &&
          "https://googleads.g.doubleclick.net" === event.origin
        ) {
          window.clickOpen = 0;
          // 关闭穿插广告
          dataLayer.push({ event: "G_AL" });
        }
      });
      // 监听失去焦点事件
      window.addEventListener("blur", () => {
        const activeElement = document.activeElement,
          sourceAttribute = activeElement.getAttribute("src");
        if (
          sourceAttribute &&
          -1 !== sourceAttribute.indexOf("googleads.g.doubleclick.net/pagead/ads?")
        ) {
          const closestIns = activeElement.closest("ins");
          let adStatus = "unfilled";
          if (closestIns) {
            adStatus = closestIns.getAttribute("data-ad-status") || adStatus;
          }
          if ("filled" == adStatus) {
            // 点击页内广告
            dataLayer.push({ event: "D_IP" });
          }
        } else if (
          sourceAttribute &&
          -1 !== sourceAttribute.indexOf("googleads.g.doubleclick.net/pagead/html/")
        ) {
          if (-1 !== sourceAttribute.indexOf("btvi=")) {
            // 点击锚定广告
            dataLayer.push({ event: "D_FI" });
          }
        }
      });
    </script>
  </body>
</html>
