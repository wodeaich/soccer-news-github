name: CompSoccer Data & Content Cron Jobs

# 纯静态数据管线：
#   脚本抓取/生成 → 写 content/*.json → commit+push 回仓库 → 显式触发 deploy 工作流重建发版
# 注意：GITHUB_TOKEN 的 push 不会触发 push 工作流（GitHub 防递归），
#       因此提交后通过 workflow_dispatch API 显式触发 deploy.yml。

on:
  schedule:
    # UTC 00:00 更新赛程 (北京时间 08:00)
    - cron: "0 0 * * *"
    # UTC 01:00 / 09:00 / 17:00 更新赛果 (赛后时段)
    - cron: "0 1 * * *"
    - cron: "0 9 * * *"
    - cron: "0 17 * * *"
    # UTC 00:30/06:30/12:30/18:30 AI 生成+翻译+录入后台上架（每6小时）
    - cron: "30 0 * * *"
    - cron: "30 6 * * *"
    - cron: "30 12 * * *"
    - cron: "30 18 * * *"
    # UTC 23:00 更新积分榜 (北京时间次日 07:00)
    - cron: "0 23 * * *"
  workflow_dispatch:
    inputs:
      job:
        description: "Run a specific job manually"
        required: true
        type: choice
        options:
          - fetch-matches
          - fetch-results
          - fetch-standings
          - pipeline
          - rss-only
          - all

permissions:
  contents: write   # push content/
  actions: write    # dispatch deploy.yml

# 串行化所有内容更新，避免并发 push 冲突
concurrency:
  group: content-sync
  cancel-in-progress: false

env:
  API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
  ADMIN_BACKEND_URL: ${{ secrets.ADMIN_BACKEND_URL }}
  ADMIN_JWT_TOKEN: ${{ secrets.ADMIN_JWT_TOKEN }}
  RELEASE_SITE_ID: ${{ secrets.RELEASE_SITE_ID }}
  BI_API_PREFIX: ${{ secrets.BI_API_PREFIX }}
  API_FOOTBALL_BASE: ${{ secrets.API_FOOTBALL_BASE }}
  WORLD_CUP_LEAGUE_ID: ${{ secrets.WORLD_CUP_LEAGUE_ID }}
  WORLD_CUP_SEASON: ${{ secrets.WORLD_CUP_SEASON }}
  MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
  MINIMAX_BASE: ${{ secrets.MINIMAX_BASE }}

jobs:
  run-data-jobs:
    name: Fetch data / generate content / sync repo
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          # 取该工作流所在分支的最新提交
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "yarn"

      - run: yarn install --frozen-lockfile

      # 按触发时间/手动选择决定要跑哪些脚本（同一 run 内串行执行，天然无并发冲突）
      - name: Resolve jobs to run
        id: plan
        run: |
          EVENT="${{ github.event_name }}"
          SCHEDULE="${{ github.event.schedule }}"
          INPUT_JOB="${{ github.event.inputs.job }}"
          JOBS=""
          if [ "$EVENT" = "workflow_dispatch" ]; then
            if [ "$INPUT_JOB" = "all" ]; then
              JOBS="fetch-matches fetch-results fetch-standings pipeline"
            else
              JOBS="$INPUT_JOB"
            fi
          else
            case "$SCHEDULE" in
              "0 0 * * *")  JOBS="fetch-matches" ;;
              "0 1 * * *"|"0 9 * * *"|"0 17 * * *") JOBS="fetch-results" ;;
              "30 0 * * *"|"30 6 * * *"|"30 12 * * *"|"30 18 * * *") JOBS="pipeline" ;;
              "0 23 * * *") JOBS="fetch-standings" ;;
            esac
          fi
          echo "jobs=$JOBS" >> "$GITHUB_OUTPUT"
          echo "Will run: $JOBS"

      - name: Fetch match schedule
        if: contains(steps.plan.outputs.jobs, 'fetch-matches')
        run: node scripts/fetch_matches.js

      - name: Fetch match results
        if: contains(steps.plan.outputs.jobs, 'fetch-results')
        run: node scripts/fetch_results.js

      - name: Fetch standings
        if: contains(steps.plan.outputs.jobs, 'fetch-standings')
        run: node scripts/fetch_standings.js

      # 一气呵成：赛事AI生成 + RSS多源 → 录入后台上架 → 翻译5语言 → 各语言独立录入上架
      - name: Generate, translate and publish articles to admin backend
        if: contains(steps.plan.outputs.jobs, 'pipeline')
        run: node scripts/pipeline.js --auto

      - name: RSS-only article generation
        if: contains(steps.plan.outputs.jobs, 'rss-only')
        run: node scripts/pipeline.js --rss

      # 把 content/ 变更提交回仓库（带 rebase 重试，防止竞态）
      - name: Commit & push content changes
        id: sync
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content
          if git diff --cached --quiet; then
            echo "No content changes."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore(content): scheduled data sync (${{ steps.plan.outputs.jobs }})"
          for i in 1 2 3 4; do
            if git push origin "HEAD:${{ github.ref_name }}"; then
              echo "pushed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git pull --rebase origin "${{ github.ref_name }}"
            sleep $((2 ** i))
          done
          echo "Push failed after retries" >&2
          exit 1

      # 显式触发部署（GITHUB_TOKEN 的 push 不会自动触发 deploy）
      - name: Trigger deploy workflow
        if: steps.sync.outputs.pushed == 'true' || contains(steps.plan.outputs.jobs, 'pipeline')
        run: |
          curl -sf -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/deploy.yml/dispatches" \
            -d "{\"ref\":\"${{ github.ref_name }}\"}"
          echo "Deploy dispatched on ${{ github.ref_name }}"
