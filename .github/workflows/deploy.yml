name: Build & Deploy CompSoccer

# 发版链路（与现有管理后台流程一致，见 docs/admin-backend-eval.md §2.2）：
#   sync_articles → yarn generate → 打包 dist 为 ZIP
#   → uploadFrontEndZip(?siteId&env) → releaseWebpack/release
#   → 管理后台并发上传至 AWS S3 / Cloudflare R2 → 域名对外服务
#
# 所需 Secrets：
#   ADMIN_BACKEND_URL  管理后台地址（含 /api，如 http://52.76.173.58:6688/api）
#   ADMIN_JWT_TOKEN    管理后台 JWT（x-token，注意有效期）
#   RELEASE_SITE_ID    compsoccer.com 在管理后台对应的发版 siteId
#   RELEASE_ENV        发版环境 test/prod（缺省 prod）
#   SITE_ID / SITE_AFS 站点数据标识（构建期注入页面 env）

on:
  push:
    branches:
      - master
  workflow_dispatch:

# 同一时刻只跑一个发版，后触发的排队
concurrency:
  group: deploy-compsoccer
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Validate required secrets
        run: |
          MISSING=""
          [ -z "${{ secrets.ADMIN_BACKEND_URL }}" ] && MISSING="$MISSING ADMIN_BACKEND_URL"
          [ -z "${{ secrets.ADMIN_JWT_TOKEN }}" ]  && MISSING="$MISSING ADMIN_JWT_TOKEN"
          [ -z "${{ secrets.RELEASE_SITE_ID }}" ]  && MISSING="$MISSING RELEASE_SITE_ID"
          if [ -n "$MISSING" ]; then
            echo "❌ 缺少必需的 Secrets:$MISSING"
            echo "   请在仓库 Settings → Secrets and variables → Actions 中配置。"
            exit 1
          fi
          echo "✅ Secrets 校验通过"

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # 后台是文章唯一数据源：发版前把「已上架文章」镜像到 content/articles/
      - name: Sync published articles from admin backend
        env:
          ADMIN_BACKEND_URL: ${{ secrets.ADMIN_BACKEND_URL }}
          ADMIN_JWT_TOKEN: ${{ secrets.ADMIN_JWT_TOKEN }}
          RELEASE_SITE_ID: ${{ secrets.RELEASE_SITE_ID }}
          BI_API_PREFIX: ${{ secrets.BI_API_PREFIX }}
        run: node scripts/sync_articles.js

      # 比赛数据来自仓库内 content/matches/（cron 采集提交）；文章来自上一步同步
      - name: Generate static site
        env:
          NODE_ENV: production
          SITE_ID: ${{ secrets.SITE_ID }}
          SITE_AFS: ${{ secrets.SITE_AFS }}
          PROD_API_URL: ${{ secrets.PROD_API_URL }}
          TEST_API_URL: ${{ secrets.TEST_API_URL }}
        run: yarn generate

      - name: Sanity-check dist
        run: |
          COUNT=$(find dist -name "*.html" | wc -l)
          echo "Generated HTML pages: $COUNT"
          if [ "$COUNT" -lt 10 ]; then
            echo "❌ 页面数异常（<10），疑似 content/ 缺失或构建失败，中止发版"
            exit 1
          fi
          for f in dist/en/index.html dist/sitemap.xml dist/robots.txt; do
            [ -f "$f" ] || { echo "❌ 缺少关键产物: $f"; exit 1; }
          done
          echo "✅ 产物校验通过"

      # 打包 + 上传 + 发版（复用 release_frontend.js，与联调同一套接口）
      - name: Package, upload & release
        env:
          ADMIN_BACKEND_URL: ${{ secrets.ADMIN_BACKEND_URL }}
          ADMIN_JWT_TOKEN: ${{ secrets.ADMIN_JWT_TOKEN }}
          RELEASE_SITE_ID: ${{ secrets.RELEASE_SITE_ID }}
          RELEASE_ENV: ${{ secrets.RELEASE_ENV }}
        run: |
          ZIP="compsoccer-dist-$(date +%Y%m%d%H%M%S).zip"
          cd dist && zip -qr "../$ZIP" . -x "*.DS_Store" && cd ..
          SIZE_MB=$(du -m "$ZIP" | cut -f1)
          echo "ZIP size: ${SIZE_MB}MB, files: $(unzip -l "$ZIP" | tail -1 | awk '{print $2}')"
          if [ "$SIZE_MB" -ge 100 ]; then
            echo "❌ ZIP 超过后台 100MB 上限"
            exit 1
          fi
          node scripts/release_frontend.js --zip "$ZIP" --site_id "$RELEASE_SITE_ID" --env "${RELEASE_ENV:-prod}"

      - name: Notify result
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "✅ Deploy completed at $(date '+%Y-%m-%d %H:%M:%S UTC')"
            echo "Site: https://compsoccer.com"
          else
            echo "❌ Deploy failed — check logs above"
          fi
