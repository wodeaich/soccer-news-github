name: Build & Deploy SoccerIns

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Generate static site
        env:
          NODE_ENV: production
          SITE_ID: ${{ secrets.SITE_ID }}
          SITE_AFS: ${{ secrets.SITE_AFS }}
          PROD_API_URL: ${{ secrets.PROD_API_URL }}
          TEST_API_URL: ${{ secrets.TEST_API_URL }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          API_FOOTBALL_BASE: ${{ secrets.API_FOOTBALL_BASE }}
          WORLD_CUP_LEAGUE_ID: ${{ secrets.WORLD_CUP_LEAGUE_ID }}
          WORLD_CUP_SEASON: ${{ secrets.WORLD_CUP_SEASON }}
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          MINIMAX_BASE: ${{ secrets.MINIMAX_BASE }}
          CDN_BASE_URL: ${{ secrets.CDN_BASE_URL }}
        run: yarn generate

      - name: Package dist as ZIP
        run: |
          cd dist
          zip -r ../deploy.zip . -x "*.DS_Store"
          cd ..
          echo "ZIP size: $(du -sh deploy.zip | cut -f1)"
          echo "File count: $(unzip -l deploy.zip | tail -1 | awk '{print $2}')"

      - name: Upload ZIP to admin backend
        id: upload
        run: |
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            "${{ secrets.ADMIN_BACKEND_URL }}/fileUploadAndDownload/uploadFrontEndZip" \
            -H "x-token: ${{ secrets.ADMIN_JWT_TOKEN }}" \
            -F "file=@deploy.zip" \
            -F "siteId=soccerins" \
            -F "env=prod")

          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -n -1)

          echo "HTTP status: $HTTP_CODE"
          echo "Response: $BODY"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "❌ Upload failed with status $HTTP_CODE"
            exit 1
          fi

          # Extract filePath for the release trigger
          FILE_PATH=$(echo "$BODY" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('data',{}).get('filePath',''))" 2>/dev/null || echo "")
          echo "file_path=$FILE_PATH" >> $GITHUB_OUTPUT
          echo "✅ Upload successful"

      - name: Trigger release on admin backend
        run: |
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            "${{ secrets.ADMIN_BACKEND_URL }}/fileUploadAndDownload/releaseFrontEnd" \
            -H "x-token: ${{ secrets.ADMIN_JWT_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"siteId\":\"soccerins\",\"env\":\"prod\"}")

          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -n -1)

          echo "HTTP status: $HTTP_CODE"
          echo "Response: $BODY"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "❌ Release trigger failed with status $HTTP_CODE"
            exit 1
          fi
          echo "✅ Release triggered successfully"

      - name: Notify result
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "✅ Deploy completed at $(date '+%Y-%m-%d %H:%M:%S UTC')"
            echo "Site: https://soccerins.com"
          else
            echo "❌ Deploy failed — check logs above"
          fi
